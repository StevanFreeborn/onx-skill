name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate-skill:
    name: Validate Agent Skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Validate skill specification
        run: npx skills-ref validate .
